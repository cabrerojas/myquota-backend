name: Deploy to VPS

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use for hotfixes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        if: github.event.inputs.skip_tests != 'true'
        run: npm test

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22022
          envs:
            NODE_OPTIONS
          script: |
            set -e

            APP_DIR="/opt/myquota-backend"

            echo "── Stopping PM2 ──"
            pm2 stop myquota-backend 2>/dev/null || true
            pm2 delete myquota-backend 2>/dev/null || true

            echo "── Pulling latest code on VPS ──"
            ssh -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd $APP_DIR && git fetch origin main && git reset --hard origin/main"

            echo "── Installing deps on VPS ──"
            ssh -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd $APP_DIR && npm ci && NODE_OPTIONS="--max-old-space-size=1024" npm run build"

            echo "── Starting PM2 ──"
            ssh -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd $APP_DIR && pm2 start ecosystem.config.js --env production && pm2 save"

            echo "── Health check ──"
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null || echo "000")
            echo "Health check returned: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "── Deployment successful ──"
            else
              echo "── Deployment may have issues — check PM2 logs ──"
              ssh -p 22022 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "pm2 logs myquota-backend --lines 20 --nostream"
              exit 1
            fi

  failure:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Notify deployment failure
        run: |
          echo "Deployment to VPS failed. Check GitHub Actions logs for details."